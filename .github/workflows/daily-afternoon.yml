# Daily green-dot run (afternoon window, ET 14:00-17:59).
# Picks one random time point (hour + minute) in the window from the date,
# so exactly one scheduled run per day proceeds; workflow_dispatch always
# proceeds (manual test).
# Runs a trending project on the ephemeral runner and commits runs/<date>.md.
# The morning run normally writes the log first; this run skips if it exists.
name: Daily run (afternoon)

on:
  schedule:
    # 18:00-22:00 UTC covers the 14:00-17:00 ET pick hours in both
    # EST (UTC-5: 19:00-22:00 UTC) and EDT (UTC-4: 18:00-21:00 UTC).
    - cron: '0 18,19,20,21,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-commits-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Pick today's random time (ET)
        id: pick
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          HOUR_NOW=$(TZ=America/New_York date +%H)
          MIN_NOW=$(TZ=America/New_York date +%M)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEED_H=$(echo -n "${TODAY}-afternoon" | md5sum | cut -c1-8)
          PICK_H=$(( (16#$SEED_H % 4) + 14 ))
          if [ "$((10#$HOUR_NOW))" -ne "$PICK_H" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEED_M=$(echo -n "${TODAY}-afternoon-minute" | md5sum | cut -c1-8)
          PICK_M=$(( 16#$SEED_M % 60 ))
          SLEEP_MIN=$(( PICK_M - 10#$MIN_NOW ))
          if [ "$SLEEP_MIN" -gt 0 ]; then
            echo "picked time ${PICK_H}:$(printf %02d "$PICK_M") ET, sleeping ${SLEEP_MIN}m"
            sleep "${SLEEP_MIN}m"
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.pick.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Skip if today's log already exists
        id: check
        if: steps.pick.outputs.proceed == 'true'
        run: |
          if [ -f "runs/${{ steps.pick.outputs.today }}.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select project
        if: steps.pick.outputs.proceed == 'true' && steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TODAY: ${{ steps.pick.outputs.today }}
          SLOT: afternoon
        run: python3 .github/scripts/select-project.py

      - name: Run project and write log
        if: steps.pick.outputs.proceed == 'true' && steps.check.outputs.skip == 'false'
        env:
          TODAY: ${{ steps.pick.outputs.today }}
        run: python3 .github/scripts/run-project.py

      - name: Commit and push log
        if: steps.pick.outputs.proceed == 'true' && steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TODAY: ${{ steps.pick.outputs.today }}
        run: |
          set -euo pipefail
          FULL_NAME=$(python3 -c "import json; print(json.load(open('run-meta.json'))['full_name'])")
          TYPE=$(python3 -c "import json; print(json.load(open('run-meta.json'))['type'])")
          git config user.name "heyjym"
          git config user.email "354487208+heyjym@users.noreply.github.com"
          git add "runs/$TODAY.md"
          git commit -m "Add run log for $TODAY: $FULL_NAME ($TYPE)"
          git -c http.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${GH_TOKEN}" | base64 -w0)" push origin HEAD:main
          sleep 3
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/heyjym/daily-commits/contents/runs/$TODAY.md")
          if [ "$CODE" != "200" ]; then
            echo "verification failed: API returned HTTP $CODE" >&2
            exit 1
          fi
          echo "verified runs/$TODAY.md on main (HTTP 200)"
